version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artplatform_postgres
    environment:
      POSTGRES_DB: artplatform
      POSTGRES_USER: artplatform
      POSTGRES_PASSWORD: artplatform_secret
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U artplatform -d artplatform']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    container_name: artplatform_adminer
    restart: always
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
