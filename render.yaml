services:
  - type: web
    name: art-platform-api
    env: node
    plan: free
    buildCommand: npm install && npm run build:api
    startCommand: cd apps/api && npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: art-platform-db
          property: connectionString
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      # Add other environment variables (JWT_SECRET, CLOUDINARY, BREVO) in the Render dashboard

  - type: psql
    name: art-platform-db
    plan: free
    postgresMajorVersion: 16
